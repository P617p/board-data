name: sync-neko-board

on:
  schedule:
    # GitHub Actions cron 是 UTC; 两条合起来 = 北京 07:00-22:50
    - cron: '*/10 23 * * *'      # 北京 07:00-07:59 (UTC 23:00-23:59, 前一日)
    - cron: '*/10 0-14 * * *'    # 北京 08:00-22:50 (UTC 00:00-14:50)
    # 午夜采样: 23:50 更新 last_balance, 00:10 触发跨天 → 当日花费基准≈自然日
    # 00:00, 日期界限误差从 70 分钟 (22:50 后无采样) 缩到 ~10 分钟
    - cron: '50 15 * * *'        # 北京 23:50 (UTC 15:50)
    - cron: '10 16 * * *'        # 北京 00:10 (UTC 16:10)
  workflow_dispatch:             # 手动触发兜底 (Actions 偶发跳过时一键恢复)

permissions:
  contents: write                # GITHUB_TOKEN 提交权限

concurrency:
  group: sync-neko-board
  cancel-in-progress: false      # 绝不中断写文件轮 (防半写状态)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成数据快照
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          WEATHER_LAT: '31.62'        # 崇明城桥镇 (与旧 .env 一致)
          WEATHER_LON: '121.39'
        run: python3 sync.py

      - name: 提交并推送
        id: commit
        if: success()
        run: |
          git config user.name 'board-data-sync'
          git config user.email 'board-data-sync@users.noreply.github.com'
          # reminders.json 由 AstrBot 插件写入, 只读不写 (避免与插件 PUT 竞争)
          # tick_*.txt 为 R5 多股票分时 (主股票 tick.txt + 附加股票 tick_<code>.txt)
          git add data.json tick.txt tick_*.txt state.json tick_history.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no content change, skip purge"
          else
            git commit -m "snapshot $(TZ=Asia/Shanghai date +%F_%H:%M)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: jsDelivr CDN 刷新
        if: success() && steps.commit.outputs.changed == 'true'
        continue-on-error: true   # purge 失败仅告警 (jsDelivr 分支缓存 ~24h, raw 兜底始终新鲜)
        run: |
          # R7: purge 偶发失败 (429 限流/网络抖动, exit 22) 导致 CDN 长期卡旧缓存,
          # 板子分时/数据一直拉旧版 → 加重试循环 (最多 3 次, 失败仅告警不断工作流)
          # 仅内容变化时才 purge (减少请求频率 → 降限流概率);
          # 板端另有新鲜度校验兜底: 盘中数据不含今天交易日自动换 raw/ghproxy (见 data_manager.cpp)
          for i in 1 2 3; do
            curl -sf -X POST https://purge.jsdelivr.net \
              -H 'content-type: application/json' \
              -d '{"path":["/gh/P617p/board-data@main/data.json","/gh/P617p/board-data@main/tick.txt",\
                   "/gh/P617p/board-data@main/tick_sz000001.txt","/gh/P617p/board-data@main/tick_sh600519.txt"]}' \
              && break
            echo "purge attempt $i failed, retrying..."
            sleep 10
          done
